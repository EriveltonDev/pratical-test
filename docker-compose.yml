services:
  api:
    build: .
    container_name: api-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/app_db}
      PORT: ${PORT:-3000}
    command: sh -c "npm install && npx prisma migrate deploy && npm run start:dev"

  db:
    image: postgres:18-alpine
    container_name: postgres-dev
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db